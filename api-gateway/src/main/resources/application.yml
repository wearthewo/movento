server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Profile-Id, X-CSRF-Token]
            allowCredentials: true
      routes:
        - id: auth
          uri: lb://user-service
          predicates: [Path=/api/v1/auth/**]
        - id: users
          uri: lb://user-service
          predicates: [Path=/api/v1/users/**]
          filters: [AuthenticationFilter]
        - id: catalog
          uri: lb://content-service
          predicates: [Path=/api/v1/catalog/**]
          filters:
            - RewritePath=/api/v1/catalog/(?<segment>.*), /api/v1/catalog/$\{segment}
        - id: admin
          uri: lb://content-service
          predicates: [Path=/api/v1/admin/catalog/**]
          filters: [AuthenticationFilter]
        - id: library
          uri: lb://content-service
          predicates: [Path=/api/v1/library/**]
          filters: [AuthenticationFilter]
        - id: playback
          uri: lb://streaming-service
          predicates: [Path=/api/v1/playback/**]
          filters: [AuthenticationFilter]
        - id: recommendations
          uri: lb://recommendation-service
          predicates: [Path=/api/v1/recommendations/**]
          filters: [AuthenticationFilter]
        - id: billing
          uri: lb://payment-service
          predicates: [Path=/api/v1/billing/**]
          filters: [AuthenticationFilter]
        - id: stripe-webhook
          uri: lb://payment-service
          predicates: [Path=/api/v1/webhooks/stripe]
security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
    issuer: ${JWT_ISSUER:movento}
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: when-authorized
logging:
  pattern.console: '{"timestamp":"%d{ISO8601}","level":"%level","service":"api-gateway","message":"%replace(%msg){\"","\\\""}"}%n'
