server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Profile-Id, X-CSRF-Token]
            allowCredentials: true
      routes:
        - id: auth
          uri: lb://user-service
          predicates: [Path=/api/v1/auth/**]
          filters:
            # Brute-force protection: ~10 auth requests per minute per client IP (burst 10).
            # user-service additionally locks an account after repeated wrong passwords.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientIpKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 6
        - id: users
          uri: lb://user-service
          predicates: [Path=/api/v1/users/**]
          filters: [AuthenticationFilter]
        - id: catalog
          uri: lb://content-service
          predicates: [Path=/api/v1/catalog/**]
          # Optional auth: anonymous browsing works, a profile token enables kids filtering.
          filters: ["AuthenticationFilter=true"]
        - id: admin
          uri: lb://content-service
          predicates: [Path=/api/v1/admin/catalog/**]
          filters: [AuthenticationFilter]
        - id: library
          uri: lb://content-service
          predicates: [Path=/api/v1/library/**]
          filters: [AuthenticationFilter]
        - id: playback
          uri: lb://streaming-service
          predicates: [Path=/api/v1/playback/**]
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@accountKeyResolver}"
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 20
        # Signed, expiring media URLs (like CDN signed URLs): the signature is the credential, no JWT needed.
        - id: media
          uri: lb://streaming-service
          predicates: [Path=/api/v1/media/**]
        - id: recommendations
          uri: lb://recommendation-service
          predicates: [Path=/api/v1/recommendations/**]
          filters: [AuthenticationFilter]
        - id: billing
          uri: lb://payment-service
          predicates: [Path=/api/v1/billing/**]
          filters: [AuthenticationFilter]
        - id: stripe-webhook
          uri: lb://payment-service
          predicates: [Path=/api/v1/webhooks/stripe]
security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
    issuer: ${JWT_ISSUER:movento}
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Discover newly started services within ~5 s instead of the 30 s default.
    registry-fetch-interval-seconds: 5
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
logging:
  pattern.console: '{"timestamp":"%d{ISO8601}","level":"%level","service":"api-gateway","message":"%replace(%msg){\"","\\\""}"}%n'
