name: Movento CI/CD

on:
  push:
    branches: [main, develop, movento-platform-release]
    tags: ["v*"]
  pull_request:
    branches: [main, develop, movento-platform-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend lint, types, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          GATEWAY_URL: "http://localhost:8080"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  docker:
    name: Docker build matrix
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, service-registry, user-service, content-service, streaming-service, recommendation-service, payment-service, web]
    env:
      # Images are published only for the release branch and version tags, never for pull requests.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/movento-platform-release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/movento/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'web' && './web/Dockerfile' || './docker/java-service.Dockerfile' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            SKIP_CHECKS=true
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: Compose integration smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate production overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env: {DOMAIN: ci.example.com, DB_PASSWORD: x, RABBITMQ_PASSWORD: x, JWT_SECRET: x, ADMIN_EMAIL: a@b.c, STRIPE_SECRET_KEY: x, STRIPE_WEBHOOK_SECRET: x}
      - name: Start application stack
        run: docker compose up -d --build
      - name: Wait for public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8761/actuator/health >/dev/null \
              && curl --fail --silent http://localhost:8080/actuator/health >/dev/null \
              && curl --fail --silent http://localhost:8080/api/v1/catalog/home >/dev/null \
              && curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Application stack did not become ready in time." >&2
          exit 1
      - name: Verify routing and service registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' http://localhost:8080/api/v1/users/me)" = "401"
          curl --fail --silent -H 'Accept: application/json' http://localhost:8761/eureka/apps > eureka-apps.json
          for service in USER-SERVICE CONTENT-SERVICE PAYMENT-SERVICE STREAMING-SERVICE RECOMMENDATION-SERVICE API-GATEWAY; do
            grep --quiet "\"name\"[[:space:]]*:[[:space:]]*\"${service}\"" eureka-apps.json
          done
          # Spoofed identity headers must be ignored on public routes.
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' -H 'X-Account-Id: 1' http://localhost:8080/api/v1/library/watchlist)" = "401"
          # Netflix-style feed: billboard plus multiple rails, and series expose episodes.
          curl --fail --silent http://localhost:8080/api/v1/catalog/home | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['featured'] and len(d['rails']) >= 4, d.keys()"
          curl --fail --silent http://localhost:8080/api/v1/catalog/titles/signal-house/episodes | python3 -c "import json,sys; assert len(json.load(sys.stdin)) >= 1"
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=300
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
