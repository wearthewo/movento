name: Movento Local CI

on:
  push:
    branches: [develop, movento-platform-release]
  pull_request:
    branches: [develop, movento-platform-release]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend lint, types, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          GATEWAY_URL: "http://localhost:8080"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  docker:
    name: Docker build matrix
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, service-registry, user-service, content-service, streaming-service, recommendation-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: movento/${{ matrix.service }}:${{ github.sha }}

  compose:
    name: Compose integration smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Start application stack
        run: docker compose up -d --build
      - name: Wait for public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8761/actuator/health >/dev/null \
              && curl --fail --silent http://localhost:8080/actuator/health >/dev/null \
              && curl --fail --silent http://localhost:8080/api/v1/catalog/home >/dev/null \
              && curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Application stack did not become ready in time." >&2
          exit 1
      - name: Verify routing and service registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' http://localhost:8080/api/v1/users/me)" = "401"
          curl --fail --silent -H 'Accept: application/json' http://localhost:8761/eureka/apps > eureka-apps.json
          for service in USER-SERVICE CONTENT-SERVICE PAYMENT-SERVICE STREAMING-SERVICE RECOMMENDATION-SERVICE API-GATEWAY; do
            grep --quiet "\"name\"[[:space:]]*:[[:space:]]*\"${service}\"" eureka-apps.json
          done
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=300
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
