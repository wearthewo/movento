server:
  port: ${PORT:8083}

spring:
  application:
    name: streaming-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:movento_streaming_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  cache:
    type: redis
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    # Refresh the local registry copy every 5 s (default 30 s) so payment-service is found soon after it starts.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.movento: ${APP_LOG_LEVEL:INFO}

app:
  media:
    base-url: ${MEDIA_BASE_URL:https://test-streams.mux.dev/x36xhzz}
    default-manifest: ${MEDIA_DEFAULT_MANIFEST:x36xhzz.m3u8}
    require-subscription: ${PLAYBACK_REQUIRE_SUBSCRIPTION:true}
    signing-secret: ${MEDIA_SIGNING_SECRET:local-media-signing-secret-change-me}
    url-ttl-seconds: ${MEDIA_URL_TTL_SECONDS:900}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service}
  messaging:
    # Topic exchange for playback events; routing key = event type (playback.started, playback.ended)
    exchange: streaming.events
media:
  manifest-template: ${MEDIA_MANIFEST_TEMPLATE:https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8}
